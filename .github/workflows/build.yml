name: Build APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          cache: true

      - name: Create Flutter Project Structure
        run: |
          # الاحتفاظ بملف الـ lib والـ pubspec جانباً، ثم إنشاء مشروع كامل بالأندرويد
          mkdir temp_lib
          cp -r lib/* temp_lib/
          flutter create . --org com.example --project-name smart_pay --platforms android
          rm -rf lib/*
          cp -r temp_lib/* lib/
          rm -rf temp_lib

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release
